<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3B82F6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Investara" />
    <link id="apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="" />
    <title>Investara — Mobile & iOS Salary, Tax & Budgeting App</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

:root {
  --outer-bg: #d4d7dd;
  --shell-bg: #ffffff;
  --card-bg: #f4f5f8;
  --card-hover: #eceef3;
  --pill-track: #f3f4f7;
  --border-subtle: #e5e7eb;
  --text-primary: #111827;
  --text-secondary: #4b5563;
  --text-muted: #8b92a1;
  --blue-primary: #3b82f6;
  --blue-deep: #1d4ed8;
  --blue-sky: #60a5fa;
  --blue-pale: #bfdbfe;
  --blue-cta: #4a8df8;
  --green-bg: #dcfce7;
  --green-text: #15803d;
  --green-solid: #16a34a;
  --red-bg: #fee2e2;
  --red-text: #dc2626;
  --red-solid: #ef4444;
  --amber-bg: #fef3c7;
  --amber-text: #d97706;
  --font-sans: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  min-height: 100%;
  background: var(--outer-bg);
  color: var(--text-primary);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  padding: 24px 20px 36px;
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

/* Main Investara Application Shell */
.app-shell {
  max-width: 1380px;
  margin: 0 auto;
  background: var(--shell-bg);
  border-radius: 28px;
  padding: 26px 32px 32px;
  box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08), 0 2px 10px rgba(15, 23, 42, 0.03);
}

/* Top Navbar */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  text-decoration: none;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.28);
}

.brand-name {
  font-size: 19px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.025em;
}

.nav-pills {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--pill-track);
  padding: 4px;
  border-radius: 12px;
  flex-wrap: wrap;
}

.nav-pill {
  border: none;
  background: transparent;
  color: #6b7280;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 14px;
  border-radius: 9px;
  cursor: pointer;
  transition: all 0.16s ease;
  white-space: nowrap;
}

.nav-pill:hover {
  color: var(--text-primary);
}

.nav-pill.active {
  background: #ffffff;
  color: var(--text-primary);
  font-weight: 600;
  box-shadow: 0 1px 4px rgba(15, 23, 42, 0.07);
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: var(--pill-track);
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: background 0.15s ease, transform 0.15s ease;
}

.icon-btn:hover {
  background: #e8ebf1;
  color: var(--text-primary);
}

.icon-btn.accent {
  background: #eff6ff;
  color: #2563eb;
}

.icon-btn.accent:hover {
  background: #dbeafe;
}

.notif-dot {
  position: absolute;
  top: 8px;
  right: 9px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ef4444;
  border: 1.5px solid #f3f4f7;
}

.avatar-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 3px 10px 3px 3px;
  border-radius: 999px;
  border: 1px solid #eceef2;
  background: #f9fafb;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s ease;
}

.avatar-btn:hover {
  background: #f1f3f7;
}

.avatar-circle {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: #ffffff;
  flex-shrink: 0;
}

.avatar-meta {
  text-align: left;
  line-height: 1.15;
}

.avatar-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
}

.avatar-role {
  font-size: 10.5px;
  color: var(--text-muted);
}

/* Popovers */
.popover-menu {
  position: absolute;
  top: 48px;
  right: 0;
  width: 280px;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
  padding: 10px;
  z-index: 60;
}

.popover-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  padding: 6px 10px 8px;
}

.popover-item {
  width: 100%;
  border: none;
  background: transparent;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: background 0.12s ease;
}

.popover-item:hover {
  background: #f4f5f8;
}

.popover-item.active {
  background: #eff6ff;
}

/* Hero Row */
.hero-row {
  display: grid;
  grid-template-columns: minmax(280px, 1.15fr) 2fr;
  align-items: center;
  gap: 24px;
  margin-bottom: 24px;
}

.hero-greeting {
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: var(--text-primary);
  line-height: 1.18;
}

.hero-subtitle {
  font-size: 13.5px;
  color: var(--text-muted);
  margin-top: 6px;
}

.kpi-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.kpi-block {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 12px;
  border-radius: 14px;
  transition: background 0.15s ease;
}

.kpi-block:hover {
  background: #f8f9fb;
}

.kpi-value-row {
  display: flex;
  align-items: center;
  gap: 7px;
}

.kpi-value {
  font-size: 25px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: var(--text-primary);
}

.kpi-arrow {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
}

.kpi-arrow.up {
  background: var(--green-solid);
  color: #ffffff;
}

.kpi-arrow.down {
  background: #fee2e2;
  color: var(--red-solid);
}

.kpi-label {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

.mini-spark {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 40px;
  padding-bottom: 2px;
  flex-shrink: 0;
}

.mini-spark-bar {
  width: 2.5px;
  border-radius: 99px;
  background: #e2e5eb;
}

.mini-spark-bar.highlight-green {
  width: 4px;
  background: var(--green-solid);
}

.mini-spark-bar.highlight-red {
  width: 4px;
  background: var(--red-solid);
}

/* Cards */
.card {
  background: var(--card-bg);
  border-radius: 18px;
  padding: 22px 24px;
}

.card-white {
  background: #ffffff;
  border: 1px solid #e7e9ef;
  border-radius: 18px;
  padding: 22px 24px;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.card-title {
  font-size: 16.5px;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--text-primary);
}

.select-pill {
  border: none;
  background: #e9ecf1;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  padding: 7px 12px;
  border-radius: 10px;
  cursor: pointer;
  outline: none;
}

/* Middle Grid */
.middle-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

/* Striped Pill Performance Chart */
.perf-chart-wrap {
  display: flex;
  gap: 14px;
  align-items: stretch;
  height: 245px;
  padding-top: 26px;
}

.perf-y-axis {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
  padding-bottom: 24px;
  min-width: 44px;
}

.perf-bars {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 10px;
  align-items: end;
}

.perf-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  justify-content: flex-end;
  position: relative;
  cursor: pointer;
}

.perf-bar-stage {
  width: 100%;
  flex: 1;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  position: relative;
}

.perf-bar {
  width: 100%;
  max-width: 38px;
  border-radius: 999px 999px 14px 14px;
  background: repeating-linear-gradient(
    -50deg,
    #e2e5ec 0px,
    #e2e5ec 4.5px,
    #f5f6f9 4.5px,
    #f5f6f9 9px
  );
  transition: transform 0.16s ease, opacity 0.16s ease;
  position: relative;
}

.perf-col:hover .perf-bar {
  transform: translateY(-2px);
}

.perf-bar.active {
  background: linear-gradient(180deg, #3b82f6 0%, #60a5fa 56%, #e6effd 100%);
  box-shadow: 0 8px 18px rgba(59, 130, 246, 0.22);
}

.perf-tooltip {
  position: absolute;
  bottom: calc(100% + 9px);
  left: 50%;
  transform: translateX(-50%);
  background: #3b82f6;
  color: #ffffff;
  font-size: 11.5px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 8px;
  white-space: nowrap;
  box-shadow: 0 6px 14px rgba(59, 130, 246, 0.3);
  z-index: 10;
}

.perf-tooltip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border-width: 5px 5px 0 5px;
  border-style: solid;
  border-color: #3b82f6 transparent transparent transparent;
}

.perf-month {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 8px;
  font-weight: 500;
}

.perf-col.active .perf-month {
  color: var(--text-primary);
  font-weight: 600;
}

/* 40-Bar Allocation Card */
.alloc-top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.alloc-sub {
  font-size: 12.5px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

.alloc-big {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: var(--text-primary);
}

.badge-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}

.badge-green {
  background: var(--green-bg);
  color: var(--green-text);
}

.badge-red {
  background: var(--red-bg);
  color: var(--red-text);
}

.badge-amber {
  background: var(--amber-bg);
  color: var(--amber-text);
}

.badge-blue {
  background: #dbeafe;
  color: #1d4ed8;
}

.alloc-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 16px;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--text-secondary);
  font-weight: 500;
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.capsule-grid {
  display: grid;
  grid-template-columns: repeat(40, minmax(0, 1fr));
  gap: 3.5px;
  height: 116px;
  align-items: stretch;
}

.capsule-bar {
  border-radius: 999px;
  transition: transform 0.14s ease, filter 0.14s ease;
  cursor: pointer;
}

.capsule-bar:hover {
  transform: scaleY(1.05);
  filter: brightness(0.95);
}

/* Bottom Grid */
.bottom-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr 0.85fr;
  gap: 20px;
}

.link-btn {
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.link-btn:hover {
  color: var(--text-primary);
}

.subtabs {
  display: flex;
  gap: 16px;
  border-bottom: 1px solid #e6e8ee;
  margin-bottom: 12px;
  overflow-x: auto;
}

.subtab {
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  padding: 0 0 8px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}

.subtab.active {
  color: var(--text-primary);
  font-weight: 600;
  border-bottom-color: var(--text-primary);
}

/* Tables */
.data-table {
  width: 100%;
  border-collapse: collapse;
}

.data-table th {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-muted);
  text-align: left;
  padding: 6px 4px 10px;
}

.data-table th.num,
.data-table td.num {
  text-align: right;
}

.data-table td {
  padding: 9px 4px;
  font-size: 12.5px;
  color: var(--text-primary);
  border-top: 1px solid rgba(226, 229, 236, 0.55);
  vertical-align: middle;
}

.data-table tr:first-child td {
  border-top: none;
}

.row-entity {
  display: flex;
  align-items: center;
  gap: 10px;
}

.circle-badge {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}

/* Ledger List */
.ledger-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.ledger-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 4px 2px;
}

.ledger-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.ledger-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ledger-sub {
  font-size: 11px;
  color: var(--text-muted);
}

.ledger-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.ledger-date {
  font-size: 11px;
  color: var(--text-muted);
}

.ledger-amt {
  font-size: 12.5px;
  font-weight: 600;
  min-width: 72px;
  text-align: right;
}

/* AI Copilot Card */
.copilot-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.copilot-icon {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
  margin-bottom: 18px;
}

.copilot-heading {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
  letter-spacing: -0.015em;
}

.copilot-body {
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--text-secondary);
  margin-bottom: 18px;
}

.copilot-metrics {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-bottom: 18px;
}

.copilot-metric-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12.5px;
}

.copilot-metric-label {
  color: var(--text-secondary);
}

.copilot-metric-val {
  font-weight: 600;
  color: var(--text-primary);
}

.btn-primary-pill {
  width: 100%;
  border: none;
  background: var(--blue-cta);
  color: #ffffff;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 12px 18px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background 0.16s ease, transform 0.14s ease;
}

.btn-primary-pill:hover {
  background: #3b82f6;
  transform: translateY(-1px);
}

.btn-secondary-pill {
  width: 100%;
  border: 1px solid #dde1e9;
  background: #ffffff;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 10px 16px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: background 0.15s ease;
}

.btn-secondary-pill:hover {
  background: #f9fafb;
}

.btn-sm {
  width: auto;
  padding: 8px 14px;
  font-size: 12px;
}

/* Form & Calculator Views */
.view-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}

.view-title {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.025em;
  color: var(--text-primary);
}

.view-subtitle {
  font-size: 13.5px;
  color: var(--text-muted);
  margin-top: 4px;
}

.two-col-layout {
  display: grid;
  grid-template-columns: 1fr 1.25fr;
  gap: 20px;
  align-items: start;
}

.three-col-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.two-col-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field.full {
  grid-column: 1 / -1;
}

.field label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.input, .select {
  width: 100%;
  border: 1px solid #e2e5ec;
  background: #ffffff;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 500;
  padding: 9px 12px;
  border-radius: 10px;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.input:focus, .select:focus {
  border-color: var(--blue-primary);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
}

.range-slider {
  width: 100%;
  accent-color: #3b82f6;
  cursor: pointer;
}

.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  border: 1px solid #e2e5ec;
  background: #ffffff;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.14s ease;
}

.chip.active, .chip:hover {

    const standardDeduction = FEDERAL_STANDARD_DEDUCTION[filingStatus];
    const federalTaxableIncome = Math.max(0, federalAgi - standardDeduction);
    const fedCalc = computeBrackets(federalTaxableIncome, FEDERAL_BRACKETS[filingStatus], 1);
    const annualFederalTax = fedCalc.totalTax + extraFedWithholdingPerPeriod * periods;

    // FICA Taxes (Section 125 reduces FICA wages; Traditional 401k does NOT reduce FICA wages)
    const ficaWages = Math.max(0, totalGrossAnnual - annualSection125);
    const ssCap = 176100;
    const annualSocialSecurity = Math.min(ficaWages, ssCap) * 0.062;
    const addlMedicareThreshold =
      filingStatus === 'married_joint' ? 250000 : filingStatus === 'married_separate' ? 125000 : 200000;
    const annualMedicareBase = ficaWages * 0.0145;
    const annualMedicareAdditional = Math.max(0, ficaWages - addlMedicareThreshold) * 0.009;
    const annualMedicare = annualMedicareBase + annualMedicareAdditional;
    const annualFica = annualSocialSecurity + annualMedicare;

    // State & Local Tax
    const stateScale = filingStatus === 'married_joint' ? 2 : 1;
    const stateDeduction = (stateInfo.deduction || 0) * (filingStatus === 'married_joint' ? 2 : 1);
    const stateTaxable = Math.max(0, totalGrossAnnual - annualPreTaxTotal - stateDeduction);
    const stateCalc = computeBrackets(stateTaxable, stateInfo.brackets, stateScale);

    // Optional NYC local tax (~3.876%) or MD county tax (~3.2%)
    let annualLocalTax = 0;
    if (stateCode === 'NY' && p.nycResident) {
      annualLocalTax = stateTaxable * 0.03876;
    } else if (stateInfo.localDefault) {
      annualLocalTax = stateTaxable * stateInfo.localDefault;
    }
    const annualSdi = stateInfo.sdiRate ? Math.min(ficaWages, 160000) * stateInfo.sdiRate : 0;
    const annualStateTax = stateCalc.totalTax + annualLocalTax + annualSdi;

    const annualTotalTaxes = annualFederalTax + annualStateTax + annualFica;
    const annualNetTakeHome = Math.max(
      0,
      totalGrossAnnual - annualPreTaxTotal - annualTotalTaxes - annualPostTaxTotal
    );

    const effectiveTaxRate = totalGrossAnnual > 0 ? (annualTotalTaxes / totalGrossAnnual) * 100 : 0;
    const federalEffectiveRate = totalGrossAnnual > 0 ? (annualFederalTax / totalGrossAnnual) * 100 : 0;
    const stateEffectiveRate = totalGrossAnnual > 0 ? (annualStateTax / totalGrossAnnual) * 100 : 0;
    const ficaEffectiveRate = totalGrossAnnual > 0 ? (annualFica / totalGrossAnnual) * 100 : 0;

    return {
      input: {
        payMode,
        baseSalary,
        annualBonus,
        filingStatus,
        state: stateCode,
        stateName: stateInfo.name,
        payFrequency,
        periods
      },
      annual: {
        gross: totalGrossAnnual,
        baseSalary,
        bonus: annualBonus,
        preTaxTotal: annualPreTaxTotal,
        k401Trad: annual401kTrad,
        roth401k: annualRoth401k,
        hsa: annualHsa,
        fsa: annualFsa,
        section125Benefits: annualSection125 - annualHsa - annualFsa,
        employerMatch: annualEmployerMatch,
        totalRetirementContribution: annual401kTrad + annualRoth401k + annualEmployerMatch,
        federalAgi,

        federalTaxableIncome,

        medicare: annualMedicare,
        ficaTotal: annualFica,

        fica: annualFica / 12,

        postTax: annualPostTaxTotal / 12,

        socialSecurity: annualSocialSecurity / periods,

        fica: annualFica / periods,

        postTax: annualPostTaxTotal / periods,

      },

        federalEffective: federalEffectiveRate,
        stateMarginal: stateCalc.marginalRate * 100,
        stateEffective: stateEffectiveRate,
        ficaEffective: ficaEffectiveRate,
        totalEffective: effectiveTaxRate,

  function calculateRaiseImpact(profileTaxParams, options) {
    const opts = options || {};
    const raiseMode = opts.raiseMode === 'flat' ? 'flat' : 'percent';
    const raisePercent = Number(opts.raisePercent) || 0;
    const raiseFlatAmount = Number(opts.raiseFlatAmount) || 0;
    const inflationRate = Number(opts.inflationRate ?? 2.8);
    const investRaisePct = Math.max(0, Math.min(100, Number(opts.investRaisePct ?? 50)));
    const expectedAnnualReturn = Number(opts.expectedAnnualReturn ?? 7.5);

    const currentCalc = calculatePaycheck(profileTaxParams);
    const currentBase = currentCalc.input.baseSalary;
    const dollarRaise =
      raiseMode === 'flat' ? raiseFlatAmount : currentBase * (raisePercent / 100);
    const newBaseSalary = Math.max(0, currentBase + dollarRaise);
    const actualPercentRaise = currentBase > 0 ? (dollarRaise / currentBase) * 100 : 0;

    const newCalc = calculatePaycheck({
      ...profileTaxParams,
      payMode: 'salary',
      baseSalary: newBaseSalary
    });

    const grossGainAnnual = newCalc.annual.gross - currentCalc.annual.gross;
    const taxDragAnnual = newCalc.annual.totalTaxes - currentCalc.annual.totalTaxes;
    const extra401kAnnual =
      newCalc.annual.k401Trad + newCalc.annual.roth401k - (currentCalc.annual.k401Trad + currentCalc.annual.roth401k);
    const extraEmployerMatchAnnual = newCalc.annual.employerMatch - currentCalc.annual.employerMatch;
    const netGainAnnual = newCalc.annual.netTakeHome - currentCalc.annual.netTakeHome;

    // Real purchasing power after inflation
    const inflationFactor = 1 + inflationRate / 100;
    const realNewNetAnnual = newCalc.annual.netTakeHome / inflationFactor;
    const realPurchasingPowerGain = realNewNetAnnual - currentCalc.annual.netTakeHome;
    const keepRatePct = grossGainAnnual > 0 ? ((netGainAnnual + extra401kAnnual) / grossGainAnnual) * 100 : 0;

    // 10-year wealth trajectory if investing investRaisePct of net gain + extra 401k/match
    const annualInvestedFromRaise =
      Math.max(0, netGainAnnual) * (investRaisePct / 100) +
      Math.max(0, extra401kAnnual) +
      Math.max(0, extraEmployerMatchAnnual);
    const r = expectedAnnualReturn / 100;
    const projection = [];
    let balance = 0;
    for (let yr = 1; yr <= 10; yr++) {
      balance = (balance + annualInvestedFromRaise) * (1 + r);
      projection.push({
        year: yr,
        label: `Yr ${yr}`,
        cumulativeWealth: Math.round(balance),
        contributed: Math.round(annualInvestedFromRaise * yr)
      });
    }

    return {
      currentCalc,
      newCalc,
      dollarRaise,
      actualPercentRaise,
      grossGainAnnual,
      taxDragAnnual,
      extra401kAnnual,
      extraEmployerMatchAnnual,
      netGainAnnual,
      netGainMonthly: netGainAnnual / 12,
      netGainPerPaycheck: netGainAnnual / currentCalc.input.periods,
      realPurchasingPowerGain,
      keepRatePct,
      annualInvestedFromRaise,
      tenYearWealth: projection[9] ? projection[9].cumulativeWealth : 0,
      projection
    };
  }

    <script>
/**
 * Investara High-Resolution JPEG Budget & Salary Report Card Generator (1920x1200)
 * Renders the active profile's salary, paycheck tax breakdown, monthly budget categories,
 * striped/gradient performance bars, 40-capsule allocation visual, and Indeed/Glassdoor
 * market benchmark directly in the Investara design language and exports a .jpg file.
 */
(function (global) {
  'use strict';

  function fmtCurrency(n) {
    const val = Math.round(Number(n) || 0);
    return (val < 0 ? '-$' : '$') + Math.abs(val).toLocaleString('en-US');
  }

  function roundRect(ctx, x, y, w, h, r) {
    const radius = typeof r === 'number' ? { tl: r, tr: r, br: r, bl: r } : r;
    ctx.beginPath();
    ctx.moveTo(x + radius.tl, y);
    ctx.lineTo(x + w - radius.tr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius.tr);
    ctx.lineTo(x + w, y + h - radius.br);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius.br, y + h);
    ctx.lineTo(x + radius.bl, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius.bl);
    ctx.lineTo(x, y + radius.tl);
    ctx.quadraticCurveTo(x, y, x + radius.tl, y);
    ctx.closePath();
  }

  function drawPillBadge(ctx, text, x, y, bgColor, textColor) {
    ctx.save();
    ctx.font = '600 16px "Plus Jakarta Sans", "Inter", sans-serif';
    const textW = ctx.measureText(text).width;
    const padX = 16;
    const w = textW + padX * 2;
    const h = 32;
    roundRect(ctx, x, y, w, h, 16);
    ctx.fillStyle = bgColor;
    ctx.fill();
    ctx.fillStyle = textColor;
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + padX, y + h / 2 + 1);
    ctx.restore();
    return w;
  }

  function renderReportToCanvas(canvas, payload) {
    const W = 1920;
    const H = 1200;
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const { profile, calc, benchmark, percentile, monthlySeries, budgetTotals, insightsText, theme } = payload;
    const accent = theme === 'emerald' ? '#10B981' : theme === 'indigo' ? '#6366F1' : '#3B82F6';
    const accentSoft = theme === 'emerald' ? '#D1FAE5' : theme === 'indigo' ? '#E0E7FF' : '#DBEAFE';

    // Outer frame background
    ctx.fillStyle = '#D4D7DD';
    ctx.fillRect(0, 0, W, H);

    // Main white rounded shell
    ctx.save();
    ctx.shadowColor = 'rgba(15, 23, 42, 0.10)';
    ctx.shadowBlur = 40;
    ctx.shadowOffsetY = 14;
    roundRect(ctx, 36, 36, W - 72, H - 72, 34);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.restore();

    // Header Row
    const padX = 82;
    const topY = 76;

    // Logo square
    roundRect(ctx, padX, topY, 46, 46, 13);
    ctx.fillStyle = accent;
    ctx.fill();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(padX + 14, topY + 14);
    ctx.lineTo(padX + 32, topY + 32);
    ctx.moveTo(padX + 32, topY + 14);
    ctx.lineTo(padX + 14, topY + 32);
    ctx.stroke();

    ctx.fillStyle = '#111827';
    ctx.font = '700 28px "Plus Jakarta Sans", sans-serif';
    ctx.fillText('Investara', padX + 60, topY + 33);

    // Center subtitle pill
    const dateStr = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    roundRect(ctx, 640, topY + 2, 640, 42, 14);
    ctx.fillStyle = '#F3F4F7';
    ctx.fill();
    ctx.fillStyle = '#4B5563';
    ctx.font = '600 17px "Plus Jakarta Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`Salary, Tax & Budget Blueprint  ·  ${dateStr}`, 960, topY + 29);
    ctx.textAlign = 'left';

    // Right Profile Chip
    roundRect(ctx, W - padX - 310, topY, 310, 46, 23);
    ctx.fillStyle = '#F4F5F8';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(W - padX - 285, topY + 23, 17, 0, Math.PI * 2);
    ctx.fillStyle = profile.avatarColor || accent;
    ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '700 13px "Plus Jakarta Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(profile.initials || 'IT', W - padX - 285, topY + 28);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#111827';
    ctx.font = '600 16px "Plus Jakarta Sans", sans-serif';
    ctx.fillText(`${profile.fullName} · ${benchmark.location.state}`, W - padX - 256, topY + 29);

    // Greeting & Top 3 KPI Strip
    const heroY = 166;
    ctx.fillStyle = '#111827';
    ctx.font = '600 40px "Plus Jakarta Sans", sans-serif';
    ctx.fillText(`${profile.firstName}'s Financial Snapshot`, padX, heroY + 28);
    ctx.fillStyle = '#8B92A1';
    ctx.font = '500 18px "Plus Jakarta Sans", sans-serif';
    ctx.fillText(`${benchmark.seniority.label} ${benchmark.title} · ${benchmark.location.label}`, padX, heroY + 60);

    const kpis = [
      {
        val: fmtCurrency(calc.annual.gross),
        sub: 'Annual Gross Income',
        up: true,
        bars: [0.35, 0.5, 0.42, 0.65, 0.48, 0.85, 0.55, 0.45]
      },
      {
        val: fmtCurrency(calc.monthly.netTakeHome),
        sub: 'Monthly Net Paycheck',
        up: true,
        bars: [0.4, 0.52, 0.62, 0.45, 0.72, 0.9, 0.6, 0.5]
      },
      {
        val: fmtCurrency(budgetTotals.totalActual),
        sub: 'Monthly Budgeted Spend',
        up: budgetTotals.surplus >= 0,
        bars: [0.6, 0.48, 0.75, 0.52, 0.68, 0.44, 0.82, 0.55]
      }
    ];

    kpis.forEach((k, idx) => {
      const kx = 760 + idx * 365;
      ctx.fillStyle = '#111827';
      ctx.font = '600 32px "Plus Jakarta Sans", sans-serif';
      ctx.fillText(k.val, kx, heroY + 26);
      const valW = ctx.measureText(k.val).width;

      // Tiny arrow square
      roundRect(ctx, kx + valW + 12, heroY + 4, 22, 22, 5);
      ctx.fillStyle = k.up ? '#16A34A' : '#FEE2E2';
      ctx.fill();
      ctx.fillStyle = k.up ? '#FFFFFF' : '#EF4444';
      ctx.font = '700 14px sans-serif';
      ctx.fillText(k.up ? '↗' : '↘', kx + valW + 17, heroY + 20);

      ctx.fillStyle = '#8B92A1';
      ctx.font = '500 16px "Plus Jakarta Sans", sans-serif';
      ctx.fillText(k.sub, kx, heroY + 56);

      // Mini sparkline
      const sx = kx + 255;
      k.bars.forEach((b, bi) => {
        const bh = Math.round(b * 48);
        const isHi = bi === 5;
        roundRect(ctx, sx + bi * 7, heroY + 52 - bh, isHi ? 5 : 3.5, bh, 2);
        ctx.fillStyle = isHi ? (k.up ? '#16A34A' : '#EF4444') : '#E2E5EC';
        ctx.fill();
      });
    });

    // Middle Row: Left = Monthly Performance Striped Pill Chart, Right = 40-Bar Allocation
    const midY = 266;
    const midH = 380;
    const leftW = 1015;
    const rightX = padX + leftW + 28;
    const rightW = W - padX - rightX;

    // Left Card
    roundRect(ctx, padX, midY, leftW, midH, 22);
    ctx.fillStyle = '#F4F5F8';
    ctx.fill();

    ctx.fillStyle = '#111827';
    ctx.font = '600 22px "Plus Jakarta Sans", sans-serif';
    ctx.fillText('Monthly Cashflow & Savings Performance', padX + 30, midY + 42);
    drawPillBadge(ctx, `${calc.input.payFrequency.toUpperCase()} · ${fmtCurrency(calc.perPaycheck.netTakeHome)}/check`, padX + leftW - 290, midY + 18, '#E7EAF0', '#374151');

    // Striped / Gradient Bars
    const maxSeries = Math.max(...monthlySeries.map((m) => m.value), 1000);
    const chartBaseY = midY + midH - 50;
    const chartMaxH = 215;
    const barGap = 20;
    const barStartX = padX + 95;
    const barW = 54;

    // Y axis guides
    ctx.fillStyle = '#8B92A1';
    ctx.font = '500 14px "Plus Jakarta Sans", sans-serif';
    [1, 0.66, 0.33].forEach((frac) => {
      const yy = chartBaseY - chartMaxH * frac;
      ctx.fillText(fmtCurrency(maxSeries * frac), padX + 26, yy + 5);
    });

    monthlySeries.forEach((m, idx) => {
      const bx = barStartX + idx * (barW + barGap);
      const bh = Math.max(46, Math.round((m.value / maxSeries) * chartMaxH));
      const by = chartBaseY - bh;
      const isActive = idx === 6; // Highlight July / Peak

      ctx.save();
      roundRect(ctx, bx, by, barW, bh, { tl: 27, tr: 27, br: 14, bl: 14 });
      ctx.clip();

      if (isActive) {
        const grad = ctx.createLinearGradient(0, by, 0, chartBaseY);
        grad.addColorStop(0, accent);
        grad.addColorStop(0.6, '#60A5FA');
        grad.addColorStop(1, '#E6EFFD');
        ctx.fillStyle = grad;
        ctx.fillRect(bx, by, barW, bh);
      } else {
        ctx.fillStyle = '#F5F6F9';
        ctx.fillRect(bx, by, barW, bh);
        ctx.strokeStyle = '#E0E4EC';
        ctx.lineWidth = 6;
        for (let s = -bh; s < barW + bh; s += 13) {
          ctx.beginPath();
          ctx.moveTo(bx + s, chartBaseY);
          ctx.lineTo(bx + s + bh * 0.7, by);
          ctx.stroke();
        }
      }
      ctx.restore();

      if (isActive) {
        const tip = fmtCurrency(m.value);
        ctx.font = '700 15px "Plus Jakarta Sans", sans-serif';
        const tw = ctx.measureText(tip).width + 24;
        roundRect(ctx, bx + barW / 2 - tw / 2, by - 42, tw, 30, 9);
        ctx.fillStyle = accent;
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.fillText(tip, bx + barW / 2, by - 22);
        ctx.textAlign = 'left';
      }

      ctx.fillStyle = isActive ? '#111827' : '#8B92A1';
      ctx.font = (isActive ? '700' : '500') + ' 14px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';

    });

    // Right Card: 40-Bar Salary & Budget Allocation
    roundRect(ctx, rightX, midY, rightW, midH, 22);

    ctx.fillStyle = '#111827';
    ctx.font = '600 22px "Plus Jakarta Sans", sans-serif';
    ctx.fillText('Salary & Budget Allocation', rightX + 30, midY + 42);

    ctx.fillStyle = '#6B7280';
    ctx.font = '500 16px "Plus Jakarta Sans", sans-serif';
    ctx.fillText('Monthly Gross Pay Distribution', rightX + 30, midY + 84);

    ctx.fillStyle = '#111827';

    const savingsRate = Math.round(((budgetTotals.savingsActual + calc.annual.totalRetirementContribution / 12) / Math.max(1, calc.monthly.gross)) * 1000) / 10;
    drawPillBadge(ctx, `↗ ${savingsRate}% Total Saved`, rightX + rightW - 210, midY + 98, '#DCFCE7', '#15803D');

    const taxShare = calc.monthly.totalTaxes;
    const needsShare = budgetTotals.needsActual;
    const wantsShare = budgetTotals.wantsActual;
    const saveShare = Math.max(0, budgetTotals.savingsActual + calc.monthly.preTax);
    const allocTotal = Math.max(1, taxShare + needsShare + wantsShare + saveShare);

    const buckets = [
      { label: 'Taxes & FICA', val: taxShare, color: '#1D4ED8' },

    let diff = totalBars - counts.reduce((a, b) => a + b, 0);
    counts[1] += diff;
    const barColors = [];
    counts.forEach((cnt, bi) => {
      for (let i = 0; i < cnt; i++) barColors.push(buckets[bi].color);

    const capAreaW = rightW - 60;
    const capStep = capAreaW / totalBars;
    const capW = Math.max(6, capStep - 5);
    for (let i = 0; i < totalBars; i++) {

    // Bottom Row (3 Cards): Budget Table, Paycheck & Market Card, AI Insights

    ctx.fillStyle = '#111827';

    profile.budgetItems.slice(0, 7).forEach((item, idx) => {

        ctx.moveTo(padX + 28, ry - 18);
        ctx.lineTo(padX + col1W - 28, ry - 18);

      ctx.fillStyle = '#111827';

      ctx.fillStyle = '#6B7280';
      ctx.font = '500 15px "Plus Jakarta Sans", sans-serif';
      ctx.fillText(item.group, padX + 295, ry + 10);

      ctx.fillStyle = '#111827';

      const over = item.monthlyActual > item.monthlyBudget && item.group !== 'Savings';

      const bg = item.group === 'Savings' ? '#DBEAFE' : over ? '#FEE2E2' : '#DCFCE7';
      const fg = item.group === 'Savings' ? '#1D4ED8' : over ? '#DC2626' : '#15803D';
      drawPillBadge(ctx, statusText, padX + col1W - 155, ry - 12, bg, fg);

    // Card 2: Paycheck & Indeed/Glassdoor Market Summary
    roundRect(ctx, col2X, botY, col2W, botH, 22);
    ctx.fillStyle = '#F4F5F8';
    ctx.fill();
    ctx.fillStyle = '#111827';
    ctx.font = '600 22px "Plus Jakarta Sans", sans-serif';
    ctx.fillText('Paycheck & Market Benchmark', col2X + 28, botY + 42);

    const ledgerRows = [
      { label: 'Gross Paycheck', sub: `${calc.input.payFrequency} (${calc.input.periods}/yr)`, val: fmtCurrency(calc.perPaycheck.gross), color: '#111827' },
      { label: 'Pre-Tax 401(k) & HSA', sub: 'Tax-advantaged deferral', val: '-' + fmtCurrency(calc.perPaycheck.preTax), color: '#2563EB' },
      { label: 'Federal & State Tax', sub: `${calc.rates.totalEffective.toFixed(1)}% Effective Total Tax`, val: '-' + fmtCurrency(calc.perPaycheck.federalTax + calc.perPaycheck.stateTax), color: '#DC2626' },

      { label: 'Net Take-Home Check', sub: 'Deposited each payday', val: fmtCurrency(calc.perPaycheck.netTakeHome), color: '#15803D' },
      { label: 'Indeed Role Median', sub: `${benchmark.title} (${benchmark.location.state})`, val: fmtCurrency(benchmark.indeedMedian), color: '#111827' },
      { label: 'Glassdoor Role Median', sub: `You rank at ${percentile}th percentile`, val: fmtCurrency(benchmark.glassdoorMedian), color: '#111827' }
    ];

    ledgerRows.forEach((row, idx) => {

      ctx.font = '700 16px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(row.val, col2X + col2W - 28, ry + 12);
      ctx.textAlign = 'left';
    });

    // Card 3: AI Copilot Summary
    roundRect(ctx, col3X, botY, col3W, botH, 22);
    ctx.fillStyle = '#F4F5F8';
    ctx.fill();

    // Copilot white circle icon
    ctx.beginPath();
    ctx.arc(col3X + 48, botY + 46, 22, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.fillStyle = accent;
    ctx.font = '700 19px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('✦', col3X + 48, botY + 53);

    const words = insightsText.split(' ');
    let line = '';
    let lineY = botY + 144;

    words.forEach((w) => {

        ctx.fillText(line, col3X + 28, lineY);
        line = w;
        lineY += 24;
      } else {
        line = test;
      }
    });
    if (line) ctx.fillText(line, col3X + 28, lineY);

    // Bottom metric rows
    const metricsY = botY + 292;
    const copilotStats = [
      ['Savings Rate', `${savingsRate}%`],
      ['Effective Tax Rate', `${calc.rates.totalEffective.toFixed(1)}%`],
      ['Market Pay Percentile', `${percentile}th`]
    ];
    copilotStats.forEach((pair, idx) => {
      const my = metricsY + idx * 34;
      ctx.fillStyle = '#6B7280';
      ctx.font = '500 15px "Plus Jakarta Sans", sans-serif';
      ctx.fillText(pair[0], col3X + 28, my);
      ctx.fillStyle = '#111827';
      ctx.font = '700 15px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(pair[1], col3X + col3W - 28, my);
      ctx.textAlign = 'left';

    roundRect(ctx, col3X + 28, botY + botH - 64, col3W - 56, 44, 22);
    ctx.fillStyle = accentSoft;
    ctx.fill();
    ctx.fillStyle = '#1D4ED8';
    ctx.font = '600 15px "Plus Jakarta Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Generated by Investara Studio', col3X + col3W / 2, botY + botH - 37);
    ctx.textAlign = 'left';
  }

  function downloadBudgetJpeg(payload) {
    const canvas = document.createElement('canvas');
    renderReportToCanvas(canvas, payload);
    const safeName = (payload.profile.fullName || 'Profile').replace(/[^a-z0-9]+/gi, '-');
    const dateStamp = new Date().toISOString().slice(0, 10);
    const fileName = `Investara-Budget-${safeName}-${dateStamp}.jpg`;
    const dataUrl = canvas.toDataURL('image/jpeg', 0.96);

    const isTouchIOS =
      typeof navigator !== 'undefined' &&
      /iPad|iPhone|iPod/.test(navigator.userAgent || '') &&
      typeof navigator.share === 'function' &&
      typeof canvas.toBlob === 'function';

    if (isTouchIOS) {
      canvas.toBlob(
        async (blob) => {
          if (blob) {
            try {
              const file = new File([blob], fileName, { type: 'image/jpeg' });
              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                  files: [file],
                  title: `${payload.profile.firstName}'s Investara Budget Blueprint`
                });
                return;
              }
            } catch (_e) {
              // Fall through to standard download
            }
          }
          const a = document.createElement('a');
          a.href = dataUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        },
        'image/jpeg',
        0.96
      );
      return dataUrl;
    }

    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    return dataUrl;
  }

  global.JpegExporter = {
    renderReportToCanvas,
    downloadBudgetJpeg
  };
})(window);

    <script>
/**
 * Investara — Salary, Paycheck Tax, Raise, Indeed/Glassdoor Benchmarks & JPEG Budgeting App
 * Zero-build vanilla ES6 application matching the Investara UI/UX design system.
 */
(function () {
  'use strict';

  const STORAGE_KEY = 'investara_budget_profiles_v1';
  const ACTIVE_PROFILE_KEY = 'investara_active_profile_v1';

  const TABS = [
    { id: 'dashboard', label: 'Dashboard' },
    { id: 'paycheck', label: 'Paycheck & Tax' },
    { id: 'raise', label: 'Raise Calculator' },
    { id: 'market', label: 'Market Salaries' },
    { id: 'studio', label: 'Budget Studio' },
    { id: 'profiles', label: 'Profiles' }
  ];

  const MONTHS = ['Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];

  // ---------------- State ----------------
  let state = {
    profiles: loadProfiles(),
    activeProfileId: loadActiveProfileId(),
    activeTab: 'dashboard',
    dashboardMetric: 'cashflow', // cashflow | savings | gross | raise10
    selectedMonthIdx: 6, // May (center-right highlighted bar matching reference)
    watchlistSubtab: 'budget', // budget | market | tax | raise
    openPopover: null, // null | 'profile' | 'notif' | 'search' | 'analysis'
    searchQuery: '',
    // Raise Calculator local controls
    raise: {
      mode: 'percent',
      percent: 10,
      flatAmount: 15000,
      inflationRate: 2.8,
      investPct: 50,
      expectedReturn: 7.5
    },
    // Market Salaries local controls
    market: {
      query: '',
      category: 'All',
      locationId: '',
      seniorityId: '',
      liveResult: null,
      loading: false
    },
    // Budget Studio JPEG theme
    jpegTheme: 'blue',
    // Mobile iOS preview & download modal
    iphoneMode: false,
    showIosModal: false,
    // New Profile modal
    showNewProfileModal: false,
    newProfileDraft: {
      fullName: '',
      roleId: 'swe',
      locationId: 'sf',
      seniorityId: 'senior',
      baseSalary: 145000,
      annualBonus: 12000,
      filingStatus: 'single'
    },
    toast: null
  };

  function loadProfiles() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch (_e) {}
    return JSON.parse(JSON.stringify(window.MarketData.DEFAULT_PROFILES));
  }

  function loadActiveProfileId() {
    try {
      const id = localStorage.getItem(ACTIVE_PROFILE_KEY);
      if (id) return id;
    } catch (_e) {}
    return 'imran';
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.profiles));
      localStorage.setItem(ACTIVE_PROFILE_KEY, state.activeProfileId);
    } catch (_e) {}
  }

  function getActiveProfile() {
    return state.profiles.find((p) => p.id === state.activeProfileId) || state.profiles[0];
  }

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmt(n) {
    const val = Math.round(Number(n) || 0);
    return (val < 0 ? '-$' : '$') + Math.abs(val).toLocaleString('en-US');
  }

  function fmtCompact(n) {
    const abs = Math.abs(Number(n) || 0);
    const sign = n < 0 ? '-' : '';
    if (abs >= 1000000) return `${sign}$${(abs / 1000000).toFixed(2)}M`;
    if (abs >= 1000) return `${sign}$${(abs / 1000).toFixed(1)}K`;
    return `${sign}$${Math.round(abs)}`;
  }

  function showToast(msg) {
    state.toast = msg;
    render();
    setTimeout(() => {
      if (state.toast === msg) {
        state.toast = null;
        render();
      }
    }, 3200);
  }

  // ---------------- Derived Calculations ----------------
  function computeProfileAnalytics(profile) {
    const calc = window.TaxEngine.calculatePaycheck(profile.taxParams);
    const benchmark = window.MarketData.getAdjustedBenchmark(
      profile.roleId,
      profile.locationId,
      profile.seniorityId
    );
    const totalComp = calc.annual.gross;
    const percentile = window.MarketData.computeSalaryPercentile(
      profile.taxParams.baseSalary,
      benchmark
    );

    let needsBudget = 0,
      needsActual = 0,
      wantsBudget = 0,
      wantsActual = 0,
      savingsBudget = 0,
      savingsActual = 0;

    for (const b of profile.budgetItems) {
      if (b.group === 'Needs') {
        needsBudget += Number(b.monthlyBudget) || 0;
        needsActual += Number(b.monthlyActual) || 0;
      } else if (b.group === 'Wants') {
        wantsBudget += Number(b.monthlyBudget) || 0;
        wantsActual += Number(b.monthlyActual) || 0;
      } else {
        savingsBudget += Number(b.monthlyBudget) || 0;
        savingsActual += Number(b.monthlyActual) || 0;
      }
    }

    const totalBudgeted = needsBudget + wantsBudget + savingsBudget;
    const totalActual = needsActual + wantsActual + savingsActual;
    const livingSpendActual = needsActual + wantsActual;
    const surplus = calc.monthly.netTakeHome - livingSpendActual;
    const totalSavedMonthly = savingsActual + calc.annual.totalRetirementContribution / 12;
    const totalSavingsRate =
      calc.monthly.gross > 0 ? (totalSavedMonthly / calc.monthly.gross) * 100 : 0;

    // 12-month realistic seasonal series for the striped/gradient chart
    const seasonalFactors = [0.89, 0.96, 0.88, 0.95, 0.92, 1.03, 1.14, 0.91, 0.87, 0.94, 0.99, 1.06];
    const monthlySeries = MONTHS.map((m, idx) => {
      let baseVal = calc.monthly.netTakeHome;
      if (state.dashboardMetric === 'savings') baseVal = Math.max(400, totalSavedMonthly);
      else if (state.dashboardMetric === 'gross') baseVal = calc.monthly.gross;
      else if (state.dashboardMetric === 'raise10') {
        baseVal = calc.monthly.netTakeHome * (1 + (idx + 1) * 0.015);
      }
      const val =
        state.dashboardMetric === 'raise10'
          ? Math.round(baseVal)
          : Math.round(baseVal * seasonalFactors[idx]);
      return { month: m, value: val };
    });

    // Budget Health Score (0-100)
    const overBudgetItems = profile.budgetItems.filter(
      (i) => i.group !== 'Savings' && i.monthlyActual > i.monthlyBudget
    ).length;
    const savingsBoost = Math.min(35, totalSavingsRate * 1.1);
    const surplusScore = surplus >= 0 ? 35 : Math.max(0, 20 + surplus / 200);
    const marketBoost = percentile >= 50 ? 25 : 15;
    const healthScore = Math.max(
      42,
      Math.min(99, Math.round(savingsBoost + surplusScore + marketBoost - overBudgetItems * 4))
    );

    const marketDiff = profile.taxParams.baseSalary - benchmark.combinedMedian;
    const marketGapTxt =
      marketDiff >= 0
        ? `${fmt(marketDiff)} above`
        : `${fmt(Math.abs(marketDiff))} below`;

    const insightsText = `${profile.firstName}, your total monthly savings & 401(k) rate is ${totalSavingsRate.toFixed(
      1
    )}% with ${fmt(surplus)}/mo free after living expenses. Your base pay ranks in the ${percentile}th percentile (${marketGapTxt} the ${
      benchmark.location.label
    } Indeed & Glassdoor median of ${fmt(benchmark.combinedMedian)}).`;

    return {
      profile,
      calc,
      benchmark,
      percentile,
      totalComp,
      budgetTotals: {
        needsBudget,
        needsActual,
        wantsBudget,
        wantsActual,
        savingsBudget,
        savingsActual,
        totalBudgeted,
        totalActual,
        livingSpendActual,
        surplus,
        totalSavedMonthly,
        totalSavingsRate
      },
      monthlySeries,
      healthScore,
      insightsText
    };
  }

  // ---------------- Shared UI Fragments ----------------
  function renderTopBar(analytics) {
    const p = analytics.profile;
    return `
      <header class="topbar">
        <div class="brand" data-action="nav" data-tab="dashboard">
          <div class="brand-mark">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </div>
          <span class="brand-name">Investara</span>
        </div>

        <nav class="nav-pills" aria-label="Main Navigation">
          ${TABS.map(
            (t) => `
            <button class="nav-pill ${state.activeTab === t.id ? 'active' : ''}" data-action="nav" data-tab="${t.id}">
              ${esc(t.label)}
            </button>`
          ).join('')}
        </nav>

        <div class="topbar-actions">
          <button class="icon-btn desktop-only-btn" title="Toggle iPhone Mobile Preview" data-action="toggle-iphone" style="${state.iphoneMode ? 'background:#111827;color:#FFFFFF;' : ''}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="12" y1="18" x2="12.01" y2="18"/>
            </svg>
          </button>

          <button class="icon-btn accent" title="Download Standalone HTML / Install on iOS" data-action="open-ios-modal">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
            </svg>
          </button>

          <button class="icon-btn" title="Quick Role & Budget Search" data-action="toggle-popover" data-pop="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
            </svg>
          </button>

          <button class="icon-btn" title="Smart Budget & Market Alerts" data-action="toggle-popover" data-pop="notif">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="notif-dot"></span>
          </button>

          <button class="icon-btn accent" title="Download Budget Report (.JPG)" data-action="download-jpeg">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>

          <button class="avatar-btn" data-action="toggle-popover" data-pop="profile" title="Switch Profile">
            <span class="avatar-circle" style="background:${esc(p.avatarColor)}">${esc(p.initials)}</span>
            <span class="avatar-meta">
              <div class="avatar-name">${esc(p.firstName)}</div>
              <div class="avatar-role">${esc(analytics.benchmark.location.state)} · ${fmtCompact(analytics.calc.annual.gross)}</div>
            </span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2.2" stroke-linecap="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>

          ${renderPopovers(analytics)}
        </div>
      </header>
    `;
  }

  function renderPopovers(analytics) {
    if (state.openPopover === 'profile') {
      return `
        <div class="popover-menu">
          <div class="popover-title">Switch Profile</div>
          ${state.profiles
            .map(
              (pr) => `

    if (state.openPopover === 'notif') {
      const overItems = analytics.profile.budgetItems.filter(
        (i) => i.group !== 'Savings' && i.monthlyActual > i.monthlyBudget
      );
      const marketGap = analytics.benchmark.combinedMedian - analytics.profile.taxParams.baseSalary;
      return `
        <div class="popover-menu" style="width:320px;">
          <div class="popover-title">Smart Alerts (${overItems.length + 2})</div>
          <div class="popover-item" style="cursor:default;align-items:flex-start;">

          </div>
          <div class="popover-item" style="cursor:default;align-items:flex-start;">
            <span class="badge-pill ${marketGap > 0 ? 'badge-amber' : 'badge-green'}" style="padding:4px 8px;">Market</span>
            <div style="font-size:12px;color:#374151;">${
              marketGap > 0
                ? `Indeed/Glassdoor median is <strong>${fmt(marketGap)}</strong> above your base pay.`
                : `You earn <strong>${fmt(Math.abs(marketGap))}</strong> above the market median!`
            }</div>
          </div>
          ${overItems
            .map(
              (item) => `
            <div class="popover-item" style="cursor:default;align-items:flex-start;">
              <span class="badge-pill badge-red" style="padding:4px 8px;">Over</span>
              <div style="font-size:12px;color:#374151;"><strong>${esc(item.name)}</strong> is ${fmt(item.monthlyActual - item.monthlyBudget)} over its ${fmt(item.monthlyBudget)} budget.</div>
            </div>`
            )
            .join('')}
        </div>
      `;
    }

    if (state.openPopover === 'search') {
      const matches = window.MarketData.ROLE_BENCHMARKS.filter((r) =>
        !state.searchQuery.trim()
          ? true
          : r.title.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
            r.category.toLowerCase().includes(state.searchQuery.toLowerCase())
      ).slice(0, 6);
      return `
        <div class="popover-menu" style="width:330px;padding:12px;">
          <div class="popover-title" style="padding-left:2px;">Jump to Role Benchmark</div>
          <input id="quick-search-input" class="input" type="text" placeholder="Search job title (e.g. Nurse, SWE, Analyst)..." value="${esc(state.searchQuery)}" style="margin-bottom:8px;" />
          ${matches
            .map(
              (r) => `
            <button class="popover-item" data-action="quick-pick-role" data-role="${esc(r.id)}">
              <div style="flex:1;">
                <div style="font-size:12.5px;font-weight:600;color:#111827;">${esc(r.title)}</div>
                <div style="font-size:11px;color:#6B7280;">${esc(r.category)} · Nat'l Median ${fmt((r.indeedMedian + r.glassdoorMedian) / 2)}</div>
              </div>
              <span style="font-size:11px;color:#2563eb;font-weight:600;">Explore →</span>
            </button>`
            )
            .join('')}
        </div>
      `;
    }

    return '';
  }

  function renderMiniSparkline(pattern, highlightMode) {
    const heights = pattern || [36, 48, 30, 60, 44, 72, 92, 54, 42, 62];
    const hiIdx = 6;
    return `
      <div class="mini-spark">
        ${heights
          .map((h, i) => {
            const cls =
              i === hiIdx
                ? highlightMode === 'red'
                  ? 'mini-spark-bar highlight-red'
                  : 'mini-spark-bar highlight-green'
                : 'mini-spark-bar';
            return `<span class="${cls}" style="height:${h}%"></span>`;
          })
          .join('')}
      </div>
    `;
  }

      1,
      calc.monthly.totalTaxes + budgetTotals.needsActual + budgetTotals.wantsActual + budgetTotals.savingsActual + calc.monthly.preTax

    const allocBuckets = [
      { label: 'Taxes & FICA', amount: calc.monthly.totalTaxes, color: '#1D4ED8' },
      { label: 'Essential Needs', amount: budgetTotals.needsActual, color: '#3B82F6' },
      { label: 'Lifestyle', amount: budgetTotals.wantsActual, color: '#60A5FA' },
      { label: 'Savings & 401k', amount: budgetTotals.savingsActual + calc.monthly.preTax, color: '#BFDBFE' }

    // Distribute 40 capsule bars cleanly
    const barCounts = allocBuckets.map((b) => Math.max(1, Math.round((b.amount / totalAlloc) * 40)));

    const capsules = [];
    barCounts.forEach((cnt, idx) => {

      <!-- Middle Row: Striped Monthly Performance + 40-Bar Allocation -->

            <div class="perf-bars">
              ${monthlySeries
                .map((m, idx) => {

                  return `
                    <div class="perf-col ${active ? 'active' : ''}" data-action="select-month" data-idx="${idx}">
                      <div class="perf-bar-stage">
                        <div class="perf-bar ${active ? 'active' : ''}" style="height:${pct}%">

        <div class="card">

            <button class="subtab ${state.watchlistSubtab === 'tax' ? 'active' : ''}" data-action="subtab" data-sub="tax">Tax Breakdown</button>
            <button class="subtab ${state.watchlistSubtab === 'raise' ? 'active' : ''}" data-action="subtab" data-sub="raise">Raise Scenarios</button>
          </div>

          <div class="table-scroll">${renderWatchlistTable(analytics)}</div>

  function renderWatchlistTable(analytics) {
    const { profile, calc, benchmark } = analytics;

    if (state.watchlistSubtab === 'market') {
      const compareIds = [profile.roleId, 'swe', 'ml-eng', 'prod-mgr', 'data-sci', 'fin-analyst', 'eng-mgr'];
      const uniqueIds = [...new Set(compareIds)].slice(0, 7);
      const rows = uniqueIds.map((id) =>
        window.MarketData.getAdjustedBenchmark(id, profile.locationId, profile.seniorityId)
      );
      return `
        <table class="data-table">
          <thead>
            <tr>
              <th>Role (${esc(benchmark.location.state)})</th>
              <th class="num">Indeed</th>
              <th class="num">Glassdoor</th>
              <th class="num">YoY</th>
              <th class="num">Vs Yours</th>
            </tr>
          </thead>
          <tbody>
            ${rows
              .map((r) => {
                const diffPct = ((r.combinedMedian - profile.taxParams.baseSalary) / Math.max(1, profile.taxParams.baseSalary)) * 100;
                const pill =
                  diffPct > 8
                    ? { cls: 'badge-green', txt: `+${diffPct.toFixed(0)}% Upside` }
                    : diffPct < -5
                    ? { cls: 'badge-blue', txt: `You Beat` }
                    : { cls: 'badge-amber', txt: `At Market` };
                return `
                  <tr>
                    <td>
                      <div class="row-entity">
                        <span class="circle-badge" style="background:#EFF6FF;color:#2563EB;">${esc(r.title.slice(0, 2).toUpperCase())}</span>
                        <span style="font-weight:600;">${esc(r.title)}</span>
                      </div>
                    </td>
                    <td class="num tabular-nums">${fmt(r.indeedMedian)}</td>
                    <td class="num tabular-nums">${fmt(r.glassdoorMedian)}</td>
                    <td class="num tabular-nums" style="color:#16A34A;">+${r.yoyGrowth}%</td>
                    <td class="num"><span class="badge-pill ${pill.cls}">${pill.txt}</span></td>
                  </tr>
                `;
              })
              .join('')}
          </tbody>
        </table>
      `;
    }

    if (state.watchlistSubtab === 'tax') {
      const items = [
        { name: 'Federal Income Tax', sub: `${calc.rates.federalMarginal.toFixed(0)}% Marginal`, amt: calc.annual.federalTax, rate: calc.rates.federalEffective, status: 'Progressive', cls: 'badge-blue' },
        { name: `${calc.input.stateName} State Tax`, sub: profile.taxParams.nycResident ? 'Incl. NYC Local' : 'State + SDI', amt: calc.annual.stateTax, rate: calc.rates.stateEffective, status: calc.annual.stateTax === 0 ? 'Tax-Free' : 'Active', cls: calc.annual.stateTax === 0 ? 'badge-green' : 'badge-amber' },
        { name: 'Social Security (OASDI)', sub: '6.2% up to $176.1k', amt: calc.annual.socialSecurity, rate: (calc.annual.socialSecurity / calc.annual.gross) * 100, status: 'FICA', cls: 'badge-amber' },
        { name: 'Medicare + Addl', sub: '1.45% + 0.9% >$200k', amt: calc.annual.medicare, rate: (calc.annual.medicare / calc.annual.gross) * 100, status: 'FICA', cls: 'badge-amber' },
        { name: '401(k) + HSA Shield', sub: 'Tax-Advantaged', amt: calc.annual.preTaxTotal, rate: (calc.annual.preTaxTotal / calc.annual.gross) * 100, status: 'Optimizes', cls: 'badge-green' },
        { name: 'Net Annual Take-Home', sub: `${calc.input.periods} Paychecks/yr`, amt: calc.annual.netTakeHome, rate: (calc.annual.netTakeHome / calc.annual.gross) * 100, status: 'Cash Pocket', cls: 'badge-green' }
      ];
      return `
        <table class="data-table">
          <thead>
            <tr>
              <th>Tax Component</th>
              <th class="num">Annual</th>
              <th class="num">Monthly</th>
              <th class="num">% Gross</th>
              <th class="num">Status</th>
            </tr>
          </thead>
          <tbody>
            ${items
              .map(
                (t) => `
              <tr>
                <td>
                  <div style="font-weight:600;">${esc(t.name)}</div>
                  <div style="font-size:11px;color:#8B92A1;">${esc(t.sub)}</div>
                </td>
                <td class="num tabular-nums" style="font-weight:600;">${fmt(t.amt)}</td>
                <td class="num tabular-nums">${fmt(t.amt / 12)}</td>
                <td class="num tabular-nums">${t.rate.toFixed(1)}%</td>
                <td class="num"><span class="badge-pill ${t.cls}">${t.status}</span></td>
              </tr>`
              )
              .join('')}
          </tbody>
        </table>
      `;
    }

    if (state.watchlistSubtab === 'raise') {
      const pcts = [3, 5, 10, 15, 20, 25];
      return `
        <table class="data-table">
          <thead>
            <tr>
              <th>Raise Scenario</th>
              <th class="num">New Base</th>
              <th class="num">Net Gain/yr</th>
              <th class="num">Net/Mo</th>
              <th class="num">10-Yr Wealth</th>
            </tr>
          </thead>
          <tbody>
            ${pcts
              .map((pct) => {
                const res = window.TaxEngine.calculateRaiseImpact(profile.taxParams, {
                  raiseMode: 'percent',
                  raisePercent: pct,
                  investPct: 50
                });
                return `
                  <tr>
                    <td><span class="badge-pill badge-blue">+${pct}% Raise</span></td>
                    <td class="num tabular-nums" style="font-weight:600;">${fmt(res.newCalc.input.baseSalary)}</td>
                    <td class="num tabular-nums" style="color:#16A34A;font-weight:600;">+${fmt(res.netGainAnnual)}</td>
                    <td class="num tabular-nums">+${fmt(res.netGainMonthly)}</td>
                    <td class="num tabular-nums" style="font-weight:600;">${fmt(res.tenYearWealth)}</td>
                  </tr>
                `;
              })
              .join('')}
          </tbody>
        </table>
      `;
    }

    // Default: Budget Categories
    return `
      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th class="num">Actual</th>
            <th class="num">Budget</th>
            <th class="num">Delta</th>
            <th class="num">Status</th>
          </tr>
        </thead>
        <tbody>
          ${profile.budgetItems
            .slice(0, 7)
            .map((item) => {
              const delta = item.monthlyActual - item.monthlyBudget;
              let statusCls = 'badge-green';
              let statusTxt = 'Optimizes';
              if (item.group === 'Savings') {
                statusCls = item.monthlyActual >= item.monthlyBudget ? 'badge-green' : 'badge-amber';
                statusTxt = item.monthlyActual >= item.monthlyBudget ? 'Optimizes' : 'Watch';
              } else if (delta > 0) {
                statusCls = 'badge-red';
                statusTxt = 'Volatility Spike';
              } else if (delta === 0) {
                statusCls = 'badge-amber';
                statusTxt = 'On Target';
              }
              return `
                <tr>
                  <td>
                    <div class="row-entity">
                      <span class="circle-badge" style="background:#FFFFFF;border:1px solid #E5E7EB;">${item.icon}</span>
                      <div>
                        <div style="font-weight:600;">${esc(item.name)}</div>
                        <div style="font-size:10.5px;color:#8B92A1;">${esc(item.group)}</div>
                      </div>
                    </div>
                  </td>
                  <td class="num tabular-nums" style="font-weight:600;">${fmt(item.monthlyActual)}</td>
                  <td class="num tabular-nums" style="color:#6B7280;">${fmt(item.monthlyBudget)}</td>
                  <td class="num tabular-nums" style="color:${
                    item.group === 'Savings'
                      ? delta >= 0
                        ? '#16A34A'
                        : '#D97706'
                      : delta > 0
                      ? '#DC2626'
                      : '#16A34A'
                  };">${delta > 0 ? '+' : ''}${fmt(delta)}</td>
                  <td class="num"><span class="badge-pill ${statusCls}">${statusTxt}</span></td>
                </tr>
              `;
            })
            .join('')}
        </tbody>
      </table>
    `;
  }
