          .map(
            (it) => `
          <button class="ios-tab-btn ${state.activeTab === it.id ? 'active' : ''}" data-action="nav" data-tab="${it.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${it.svg}</svg>
            <span>${it.label}</span>
          </button>`
          )
          .join('')}
      </nav>
    `;
  }

  function renderIosModal() {
    if (!state.showIosModal) return '';
    return `
      <div class="modal-backdrop">
        <div class="modal-card">
          <div class="card-header">
            <div>
              <h2 class="card-title" style="font-size:19px;">Download & Install on iOS (iPhone / iPad)</h2>
              <p style="font-size:12px;color:#6B7280;margin-top:2px;">100% offline-capable single HTML file + Home Screen Web App</p>
            </div>
            <button class="chip" data-action="close-ios-modal">✕</button>
          </div>

          <div style="display:flex;flex-direction:column;gap:12px;">
            <div class="card" style="padding:16px;">
              <div style="font-size:13.5px;font-weight:700;margin-bottom:4px;">Option 1: Download Self-Contained HTML File</div>
              <p style="font-size:12.5px;color:#4B5563;line-height:1.5;margin-bottom:12px;">
                Downloads <strong>Investara-iOS-App.html</strong> with all calculators, Indeed/Glassdoor benchmarks, JPEG exporter, and mobile UI bundled into one file. AirDrop or save it to the iOS <strong>Files</strong> app to open anytime offline.
              </p>
              <button class="btn-primary-pill" data-action="download-standalone-html">
                Download Standalone HTML File (.html) ↓
              </button>
            </div>

            <div class="card" style="padding:16px;">
              <div style="font-size:13.5px;font-weight:700;margin-bottom:6px;">Option 2: Install to iPhone Home Screen (Safari)</div>
              <ol style="font-size:12.5px;color:#4B5563;line-height:1.65;padding-left:18px;margin-bottom:10px;">
                <li>Open this dashboard in <strong>Safari</strong> on your iPhone or iPad.</li>
                <li>Tap the <strong>Share</strong> button (square with upward arrow) in Safari's toolbar.</li>
                <li>Tap <strong>"Add to Home Screen"</strong> — Investara launches full-screen like a native iOS app.</li>
              </ol>
              <button class="btn-secondary-pill" data-action="toggle-iphone">
                ${state.iphoneMode ? 'Exit iPhone Mobile Preview' : 'Preview iPhone Layout Right Here 📱'}
              </button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  async function downloadStandaloneHtml() {
    const fileName = 'Investara-iOS-App.html';
    try {
      if (window.location.protocol.startsWith('http')) {
        const resp = await fetch('./investara-ios.html');
        if (resp.ok) {
          const text = await resp.text();
          const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
          triggerBlobDownload(blob, fileName);
          showToast('Downloaded Investara-iOS-App.html');
          return;
        }
      }
    } catch (_err) {}

    // Offline / file:// fallback: clone current DOM with clean #root so it boots fresh
    const clone = document.documentElement.cloneNode(true);
    const cloneRoot = clone.querySelector('#root');
    if (cloneRoot) cloneRoot.innerHTML = '';
    const htmlString = '<!DOCTYPE html>\n' + clone.outerHTML;
    const blob = new Blob([htmlString], { type: 'text/html;charset=utf-8' });
    triggerBlobDownload(blob, fileName);
    showToast('Downloaded Investara-iOS-App.html');
  }

  function triggerBlobDownload(blob, fileName) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  // ---------------- Main Render Loop ----------------
  function render() {
    const root = document.getElementById('root');
    if (!root) return;

    const activeProfile = getActiveProfile();
    const analytics = computeProfileAnalytics(activeProfile);

    let viewHtml = '';
    if (state.activeTab === 'dashboard') viewHtml = renderDashboard(analytics);
    else if (state.activeTab === 'paycheck') viewHtml = renderPaycheckView(analytics);
    else if (state.activeTab === 'raise') viewHtml = renderRaiseView(analytics);
    else if (state.activeTab === 'market') viewHtml = renderMarketView(analytics);
    else if (state.activeTab === 'studio') viewHtml = renderStudioView(analytics);
    else if (state.activeTab === 'profiles') viewHtml = renderProfilesView();

    const shellHtml = `
      <main class="app-shell ${state.iphoneMode ? 'iphone-frame' : ''}">
        ${renderTopBar(analytics)}
        ${viewHtml}
        ${renderIosBottomBar()}
      </main>
    `;

    root.innerHTML = `
      ${
        state.iphoneMode
          ? `<div class="iphone-preview-stage">
               <div class="iphone-preview-banner">
                 <span>📱 iPhone 16 Pro Mobile View (393px)</span>
                 <button class="chip active" data-action="download-standalone-html">Download iOS HTML ↓</button>
                 <button class="chip" data-action="toggle-iphone">Back to Desktop</button>
               </div>
               ${shellHtml}
             </div>`
          : shellHtml
      }
      ${renderNewProfileModal()}
      ${renderIosModal()}
      ${state.toast ? `<div class="toast">✓ ${esc(state.toast)}</div>` : ''}
    `;

    attachPostRenderBindings(analytics);
  }

  function attachPostRenderBindings(analytics) {
    // Render live JPEG preview canvas if on Studio tab
    if (state.activeTab === 'studio') {
      const canvas = document.getElementById('jpeg-preview-canvas');
      if (canvas) {
        window.JpegExporter.renderReportToCanvas(canvas, {
          ...analytics,
          theme: state.jpegTheme
        });
      }
    }

    // Dashboard metric dropdown
    const metricSelect = document.getElementById('dash-metric-select');
    if (metricSelect) {
      metricSelect.addEventListener('change', (e) => {
        state.dashboardMetric = e.target.value;
        render();
      });
    }

    // Quick search input inside popover
    const qInput = document.getElementById('quick-search-input');
    if (qInput) {
      qInput.focus();
      qInput.setSelectionRange(qInput.value.length, qInput.value.length);
      qInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        render();
      });
    }

    // Paycheck inputs (live update without full focus loss using change/input debounce)
    document.querySelectorAll('.tax-input').forEach((el) => {
      el.addEventListener('change', (e) => {
        const key = e.target.dataset.taxKey;
        const val = Number(e.target.value) || 0;
        const pr = getActiveProfile();
        pr.taxParams[key] = val;
        saveState();
        render();
      });
    });

    document.querySelectorAll('.tax-select').forEach((el) => {
      el.addEventListener('change', (e) => {
        const key = e.target.dataset.taxKey;
        const pr = getActiveProfile();
        pr.taxParams[key] = e.target.value;
        saveState();
        render();
      });
    });

    document.querySelectorAll('.tax-check').forEach((el) => {
      el.addEventListener('change', (e) => {
        const key = e.target.dataset.taxKey;
        const pr = getActiveProfile();
        pr.taxParams[key] = e.target.checked;
        saveState();
        render();
      });
    });

    // Raise calculator sliders & inputs
    const pctSlider = document.getElementById('raise-pct-slider');
    if (pctSlider) {
      pctSlider.addEventListener('change', (e) => {
        state.raise.percent = Number(e.target.value);
        render();
      });
    }
    const flatInput = document.getElementById('raise-flat-input');
    if (flatInput) {
      flatInput.addEventListener('change', (e) => {
        state.raise.flatAmount = Number(e.target.value) || 0;
        render();
      });
    }
    const infSlider = document.getElementById('raise-inflation-slider');
    if (infSlider) {
      infSlider.addEventListener('change', (e) => {
        state.raise.inflationRate = Number(e.target.value);
        render();
      });
    }
    const invSlider = document.getElementById('raise-invest-slider');
    if (invSlider) {
      invSlider.addEventListener('change', (e) => {
        state.raise.investPct = Number(e.target.value);
        render();
      });
    }
    const retSlider = document.getElementById('raise-return-slider');
    if (retSlider) {
      retSlider.addEventListener('change', (e) => {
        state.raise.expectedReturn = Number(e.target.value);
        render();
      });
    }

    // Market filters
    const mSearch = document.getElementById('market-search-input');
    if (mSearch) {
      mSearch.addEventListener('change', (e) => {
        state.market.query = e.target.value;
        state.market.liveResult = null;
        render();
      });
    }
    const mLoc = document.getElementById('market-loc-select');
    if (mLoc) {
      mLoc.addEventListener('change', (e) => {
        state.market.locationId = e.target.value;
        state.market.liveResult = null;
        render();
      });
    }
    const mSen = document.getElementById('market-sen-select');
    if (mSen) {
      mSen.addEventListener('change', (e) => {
        state.market.seniorityId = e.target.value;
        state.market.liveResult = null;
        render();
      });
    }

    // Budget category edits
    document.querySelectorAll('.budget-edit').forEach((el) => {
      el.addEventListener('change', (e) => {
        const bid = e.target.dataset.bid;
        const field = e.target.dataset.field;
        const pr = getActiveProfile();
        const item = pr.budgetItems.find((b) => b.id === bid);
        if (!item) return;
        item[field] =
          field === 'monthlyBudget' || field === 'monthlyActual'
            ? Math.max(0, Number(e.target.value) || 0)
            : e.target.value;
        saveState();
        render();
      });
    });

    // Save analytics reference on window for easy inspection
    window.__investaraAnalytics = analytics;
  }

  // ---------------- Global Event Delegation ----------------
  document.addEventListener('click', async (e) => {
    const target = e.target.closest('[data-action]');

    // Close popovers if clicking outside topbar actions
    if (!e.target.closest('.topbar-actions') && state.openPopover) {
      state.openPopover = null;
      render();
      if (!target) return;
    }

    if (!target) return;
    const action = target.dataset.action;

    if (action === 'nav') {
      state.activeTab = target.dataset.tab;
      state.openPopover = null;
      render();
    } else if (action === 'toggle-popover') {
      const pop = target.dataset.pop;
      state.openPopover = state.openPopover === pop ? null : pop;
      render();
    } else if (action === 'switch-profile') {
      state.activeProfileId = target.dataset.id;
      state.openPopover = null;
      state.market.locationId = '';
      state.market.seniorityId = '';
      state.market.liveResult = null;
      saveState();
      render();
      showToast(`Switched to ${getActiveProfile().fullName}`);
    } else if (action === 'select-month') {
      state.selectedMonthIdx = Number(target.dataset.idx);
      render();
    } else if (action === 'subtab') {
      state.watchlistSubtab = target.dataset.sub;
      render();
    } else if (action === 'download-jpeg') {
      const activeProfile = getActiveProfile();
      const analytics = computeProfileAnalytics(activeProfile);
      window.JpegExporter.downloadBudgetJpeg({
        ...analytics,
        theme: state.jpegTheme
      });
      showToast(`Downloaded Investara-Budget-${activeProfile.firstName}.jpg`);
    } else if (action === 'set-tax') {
      const pr = getActiveProfile();
      pr.taxParams[target.dataset.key] = target.dataset.val;
      saveState();
      render();
    } else if (action === 'raise-mode') {
      state.raise.mode = target.dataset.mode;
      render();
    } else if (action === 'raise-pct') {
      state.raise.mode = 'percent';
      state.raise.percent = Number(target.dataset.pct);
      render();
    } else if (action === 'match-market') {
      const targetSal = Number(target.dataset.target);
      const pr = getActiveProfile();
      const diff = Math.max(0, targetSal - pr.taxParams.baseSalary);
      state.raise.mode = 'flat';
      state.raise.flatAmount = diff;
      render();
    } else if (action === 'apply-raise') {
      const pr = getActiveProfile();
      pr.taxParams.baseSalary = Number(target.dataset.newbase);
      saveState();
      render();
      showToast(`Updated ${pr.firstName}'s base salary to ${fmt(pr.taxParams.baseSalary)}`);
    } else if (action === 'market-cat') {
      state.market.category = target.dataset.cat;
      render();
    } else if (action === 'inspect-role') {
      const pr = getActiveProfile();
      const locId = state.market.locationId || pr.locationId;
      const senId = state.market.seniorityId || pr.seniorityId;
      state.market.liveResult = window.MarketData.getAdjustedBenchmark(
        target.dataset.role,
        locId,
        senId
      );
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else if (action === 'quick-pick-role') {
      state.openPopover = null;
      state.activeTab = 'market';
      const pr = getActiveProfile();
      state.market.liveResult = window.MarketData.getAdjustedBenchmark(
        target.dataset.role,
        state.market.locationId || pr.locationId,
        state.market.seniorityId || pr.seniorityId
      );
      render();
    } else if (action === 'live-market-lookup') {
      const pr = getActiveProfile();
      const inputEl = document.getElementById('market-search-input');
      const queryVal = inputEl ? inputEl.value : state.market.query;
      state.market.query = queryVal;
      state.market.loading = true;
      render();
      const result = await window.MarketData.searchMarketSalary(
        queryVal || pr.roleTitle,
        state.market.locationId || pr.locationId,
        state.market.seniorityId || pr.seniorityId
      );
      state.market.loading = false;
      state.market.liveResult = result;
      render();
      showToast(`Loaded Indeed & Glassdoor benchmark for "${result.title}"`);
    } else if (action === 'simulate-market-raise') {
      const targetSal = Number(target.dataset.salary);
      const pr = getActiveProfile();
      state.raise.mode = 'flat';
      state.raise.flatAmount = Math.max(0, targetSal - pr.taxParams.baseSalary);
      state.activeTab = 'raise';
      render();
    } else if (action === 'set-profile-role') {
      const pr = getActiveProfile();
      if (target.dataset.role && target.dataset.role !== 'custom') {
        pr.roleId = target.dataset.role;
      }
      pr.roleTitle = target.dataset.title;
      pr.locationId = target.dataset.loc;
      pr.seniorityId = target.dataset.sen;
      const locObj = window.MarketData.getLocationById(pr.locationId);
      pr.taxParams.state = locObj.state;
      pr.taxParams.nycResident = Boolean(locObj.nycResident);
      saveState();
      render();
      showToast(`Updated ${pr.firstName}'s role to ${pr.roleTitle} (${locObj.label})`);
    } else if (action === 'jpeg-theme') {
      state.jpegTheme = target.dataset.theme;
      render();
    } else if (action === 'preset-budget') {
      const pr = getActiveProfile();
      const calc = window.TaxEngine.calculatePaycheck(pr.taxParams);
      const net = calc.monthly.netTakeHome;
      const isFire = target.dataset.preset === 'fire';
      const needsShare = isFire ? 0.42 : 0.50;
      const wantsShare = isFire ? 0.18 : 0.30;
      const saveShare = isFire ? 0.40 : 0.20;
      pr.budgetItems = [
        { id: 'p1', name: 'Housing & Mortgage', group: 'Needs', monthlyBudget: Math.round(net * needsShare * 0.62), monthlyActual: Math.round(net * needsShare * 0.62), icon: '🏠', color: '#111827' },
        { id: 'p2', name: 'Groceries & Essentials', group: 'Needs', monthlyBudget: Math.round(net * needsShare * 0.22), monthlyActual: Math.round(net * needsShare * 0.22), icon: '🛒', color: '#16A34A' },
        { id: 'p3', name: 'Utilities & Transit', group: 'Needs', monthlyBudget: Math.round(net * needsShare * 0.16), monthlyActual: Math.round(net * needsShare * 0.16), icon: '⚡', color: '#F59E0B' },
        { id: 'p4', name: 'Dining & Lifestyle', group: 'Wants', monthlyBudget: Math.round(net * wantsShare * 0.65), monthlyActual: Math.round(net * wantsShare * 0.65), icon: '🍽️', color: '#8B5CF6' },
        { id: 'p5', name: 'Travel & Subscriptions', group: 'Wants', monthlyBudget: Math.round(net * wantsShare * 0.35), monthlyActual: Math.round(net * wantsShare * 0.35), icon: '✈️', color: '#EC4899' },
        { id: 'p6', name: 'Index ETFs & Brokerage', group: 'Savings', monthlyBudget: Math.round(net * saveShare * 0.75), monthlyActual: Math.round(net * saveShare * 0.75), icon: '📈', color: '#2563EB' },
        { id: 'p7', name: 'Emergency HYSA', group: 'Savings', monthlyBudget: Math.round(net * saveShare * 0.25), monthlyActual: Math.round(net * saveShare * 0.25), icon: '🏦', color: '#0EA5E9' }
      ];
      saveState();
      render();
      showToast(`Applied ${isFire ? 'FIRE 40% Savings' : '50/30/20 Balanced'} Budget Preset`);
    } else if (action === 'add-budget-row') {
      const pr = getActiveProfile();
      pr.budgetItems.push({
        id: 'b_' + Date.now(),
        name: 'New Category',
        group: 'Wants',
        monthlyBudget: 250,
        monthlyActual: 250,
        icon: '✨',
        color: '#3B82F6'
      });
      saveState();
      render();
    } else if (action === 'del-budget-row') {
      const pr = getActiveProfile();
      pr.budgetItems = pr.budgetItems.filter((b) => b.id !== target.dataset.bid);
      saveState();
      render();
    } else if (action === 'open-new-profile') {
      state.showNewProfileModal = true;
      render();
    } else if (action === 'close-new-profile') {
      state.showNewProfileModal = false;
      render();
    } else if (action === 'save-new-profile') {
      const name = (document.getElementById('np-name')?.value || '').trim() || 'Alex Morgan';
      const roleId = document.getElementById('np-role')?.value || 'swe';
      const locationId = document.getElementById('np-loc')?.value || 'sf';
      const baseSalary = Math.max(10000, Number(document.getElementById('np-salary')?.value) || 120000);
      const annualBonus = Math.max(0, Number(document.getElementById('np-bonus')?.value) || 0);
      const filingStatus = document.getElementById('np-filing')?.value || 'single';

      const roleObj = window.MarketData.ROLE_BENCHMARKS.find((r) => r.id === roleId) || window.MarketData.ROLE_BENCHMARKS[0];
      const locObj = window.MarketData.getLocationById(locationId);
      const parts = name.split(/\s+/);
      const initials = (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
      const colors = ['#3B82F6', '#10B981', '#6366F1', '#0EA5E9', '#EC4899'];
      const newId = 'prof_' + Date.now();

      const newProfile = {
        id: newId,
        firstName: parts[0],
        fullName: name,
        avatarColor: colors[state.profiles.length % colors.length],
        initials,
        tagline: `${roleObj.title} · ${locObj.label}`,
        roleId,
        roleTitle: roleObj.title,
        seniorityId: 'senior',
        locationId,
        taxParams: {
          payMode: 'salary',
          baseSalary,
          annualBonus,
          hourlyRate: Math.round(baseSalary / 2080),
          regularHoursPerWeek: 40,
          overtimeHoursPerWeek: 0,
          filingStatus,
          state: locObj.state,
          nycResident: Boolean(locObj.nycResident),
          payFrequency: 'biweekly',
          k401Percent: 10,
          roth401kPercent: 0,
          employerMatchPercent: 4,
          annualHsa: 3000,
          annualFsa: 0,
          medicalPerPaycheck: 90,
          dentalVisionPerPaycheck: 20,
          commuterPerPaycheck: 0,
          extraFederalWithholding: 0,
          otherPostTaxPerPaycheck: 0,
          age50Plus: false
        },
        budgetItems: JSON.parse(JSON.stringify(window.MarketData.DEFAULT_PROFILES[0].budgetItems))
      };
      state.profiles.push(newProfile);
      state.activeProfileId = newId;
      state.showNewProfileModal = false;
      saveState();
      render();
      showToast(`Created & activated profile: ${name}`);
    } else if (action === 'duplicate-profile') {
      const src = state.profiles.find((p) => p.id === target.dataset.id);
      if (!src) return;
      const copy = JSON.parse(JSON.stringify(src));
      copy.id = 'copy_' + Date.now();
      copy.firstName = `${src.firstName} (Copy)`;
      copy.fullName = `${src.fullName} (Scenario)`;
      state.profiles.push(copy);
      state.activeProfileId = copy.id;
      saveState();
      render();
      showToast(`Cloned scenario for ${src.firstName}`);
    } else if (action === 'switch-and-edit') {
      state.activeProfileId = target.dataset.id;
      state.activeTab = 'paycheck';
      saveState();
      render();
    } else if (action === 'delete-profile') {
      if (state.profiles.length <= 1) return;
      const idToDel = target.dataset.id;
      state.profiles = state.profiles.filter((p) => p.id !== idToDel);
      if (state.activeProfileId === idToDel) {
        state.activeProfileId = state.profiles[0].id;
      }
      saveState();
      render();
      showToast('Profile removed');
    } else if (action === 'reset-profiles') {
      state.profiles = JSON.parse(JSON.stringify(window.MarketData.DEFAULT_PROFILES));
      state.activeProfileId = 'imran';
      saveState();
      render();
      showToast('Restored default Investara profiles');
    } else if (action === 'toggle-iphone') {
      state.iphoneMode = !state.iphoneMode;
      state.showIosModal = false;
      state.openPopover = null;
      render();
      showToast(state.iphoneMode ? 'Switched to iPhone Mobile Preview' : 'Switched to Full Desktop View');
    } else if (action === 'open-ios-modal') {
      state.showIosModal = true;
      state.openPopover = null;
      render();
    } else if (action === 'close-ios-modal') {
      state.showIosModal = false;
      render();
    } else if (action === 'download-standalone-html') {
      state.showIosModal = false;
      await downloadStandaloneHtml();
    }
  });

  // Boot app
  render();
})();

    </script>
